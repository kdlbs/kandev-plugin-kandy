id: "kandev-plugin-kandy"
api_version: 1
version: "0.3.1"
display_name: "Kandy"
description: "A tiny creature that grows as your agents work — it feeds on agent runs, turns, and conversation, and evolves forever in your session top bar."
author: "kandev"
categories: ["tools"]

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# The kandy's lifetime XP ledger lives in Host state (scope "instance"),
# fed by work signals from the event bus. The XP recipe is intentionally
# server-side only — the UI never sees the factor breakdown.
capabilities:
  state: true
  events:
    - "turn.completed"
    - "agent.completed"
    - "message.added"

webhooks:
  - key: "kandy"
    description: "Current kandy presentation state as JSON (GET; dev-only ?debug_grant=<n> when debug config is on)"
    method: "GET"
  - key: "pet"
    description: "Pet the kandy (POST): stamps last_petted_at, which briefly lifts the displayed mood and slowly warms its temperament. Never grants XP. Refused for 60s after a bonk."
    method: "POST"
  - key: "bonk"
    description: "Bonk the kandy with a stick (POST): darkens its persistent temperament (rate-limited), drops the displayed mood for 30min and makes it refuse pets for 60s. Never touches XP."
    method: "POST"

ui:
  bundle: "/ui/bundle.js"

config_schema:
  type: object
  properties:
    debug:
      type: boolean
      title: "Debug mode"
      description: "Enables the ?debug_grant dev/demo knob on the kandy webhook. Leave off in normal use."
      default: false
