id: "kandev-plugin-shipling"
api_version: 1
version: "0.5.0"
display_name: "Shipling"
description: "A tiny creature that grows when you ship — it feeds on shipped tasks, agent runs, and turns, and evolves forever in your session top bar."
author: "kandev"
categories: ["tools"]

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"

# The shipling's lifetime XP ledger lives in Host state (scope "instance"),
# fed by work signals from the event bus. The XP recipe is intentionally
# server-side only — the UI never sees the factor breakdown.
capabilities:
  state: true
  events:
    - "task.state_changed"
    - "task.updated"
    - "turn.completed"
    - "agent.completed"
    - "message.added"

webhooks:
  - key: "shipling"
    description: "Current shipling presentation state as JSON (GET; dev-only ?debug_grant=<n> when debug config is on)"
    method: "GET"

ui:
  bundle: "/ui/bundle.js"

config_schema:
  type: object
  properties:
    debug:
      type: boolean
      title: "Debug mode"
      description: "Enables the ?debug_grant dev/demo knob on the shipling webhook. Leave off in normal use."
      default: false
