name: Build

on:
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Build plugin packages
    runs-on: ubuntu-latest
    steps:
      # The local Kandev SDK replacement expects this sibling layout.
      - name: Checkout plugin
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin

      - name: Checkout Kandev SDK
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          ref: 9f5ffd70b9265bdf07e3a2448af363b162525bb0
          path: kandev
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Build host binary
        working-directory: plugin
        run: make build

      - name: Package all supported platforms
        working-directory: plugin
        run: make package
