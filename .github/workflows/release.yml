name: release

# Dispatch builds and validates the complete candidate before pushing release
# metadata or a tag. Pushed tags pass through the same checks before publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Build and validate the candidate without committing, tagging, or publishing"
        required: true
        type: boolean
        default: false

concurrency:
  group: kandy-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Validate and prepare release candidate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require master
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$CURRENT_REF" = "refs/heads/master" || {
            echo "Run releases from master, not $CURRENT_REF." >&2
            exit 1
          }

      - name: Check out master and release tags
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin
          ref: master
          fetch-depth: 0

      - name: Read pinned Kandev source revision
        id: sdk
        working-directory: plugin
        run: |
          set -euo pipefail
          sdk_ref="$(cat .kandev-sdk-ref)"
          [[ "$sdk_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$sdk_ref" >> "$GITHUB_OUTPUT"

      - name: Check out Kandev SDK contract
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          path: kandev
          ref: ${{ steps.sdk.outputs.ref }}
          sparse-checkout: |
            apps/backend
            apps/packages/plugin-sdk

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Compute next release version
        id: version
        working-directory: plugin
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          VERSION_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          CURRENT_VERSION="$(sed -nE 's/^version: "([^"]+)"$/\1/p' manifest.yaml)"
          MAKE_VERSION="$(sed -nE 's/^VERSION := ([^[:space:]]+)$/\1/p' Makefile)"
          printf '%s\n' "$CURRENT_VERSION" | grep -Eq "$VERSION_PATTERN" || { echo "manifest.yaml has an invalid version." >&2; exit 1; }
          printf '%s\n' "$MAKE_VERSION" | grep -Eq "$VERSION_PATTERN" || { echo "Makefile has an invalid version." >&2; exit 1; }
          test "$CURRENT_VERSION" = "$MAKE_VERSION" || {
            echo "manifest.yaml ($CURRENT_VERSION) and Makefile ($MAKE_VERSION) disagree." >&2
            exit 1
          }
          CURRENT_BASE="${CURRENT_VERSION%%-*}"

          LATEST_TAG="$(git tag --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/' | sort -V | tail -n 1)"
          BASELINE="$(CURRENT_BASE="$CURRENT_BASE" LATEST_TAG="$LATEST_TAG" python3 - <<'PY'
          import os
          current = tuple(map(int, os.environ["CURRENT_BASE"].split(".")))
          latest = os.environ["LATEST_TAG"].removeprefix("v")
          tagged = tuple(map(int, latest.split("."))) if latest else (0, 0, 0)
          print(".".join(map(str, max(current, tagged))))
          PY
          )"
          IFS=. read -r MAJOR MINOR PATCH <<<"$BASELINE"
          case "$BUMP" in
            patch) NEXT="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            minor) NEXT="$MAJOR.$((MINOR + 1)).0" ;;
            major) NEXT="$((MAJOR + 1)).0.0" ;;
            *) echo "Unsupported version bump: $BUMP" >&2; exit 1 ;;
          esac
          TAG="v$NEXT"

          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Tag already exists locally: $TAG" >&2
            exit 1
          fi
          REMOTE_TAG="$(git ls-remote --tags origin "refs/tags/$TAG")"
          test -z "$REMOTE_TAG" || { echo "Tag already exists on origin: $TAG" >&2; exit 1; }

          echo "Current version: $CURRENT_VERSION"
          echo "Latest release tag: ${LATEST_TAG:-none}"
          echo "Next version: $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Update candidate metadata and changelog
        working-directory: plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          set -euo pipefail
          sed -i -E "s/^version: \"[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\"$/version: \"$VERSION\"/" manifest.yaml
          sed -i -E "s/^VERSION := [0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$/VERSION := $VERSION/" Makefile
          sed -i -E "s/kandev-plugin-kandy-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.tar\.gz/kandev-plugin-kandy-$VERSION.tar.gz/" README.md

          if [ -n "$PREVIOUS_TAG" ]; then RANGE="$PREVIOUS_TAG..HEAD"; else RANGE=HEAD; fi
          CHANGES="$(git log --no-merges --format='- %s (%h)' "$RANGE")"
          test -n "$CHANGES" || CHANGES="- Initial release"
          {
            echo "# Changelog"
            echo
            printf '## [%s] - %s\n\n' "$VERSION" "$(date -u +%F)"
            echo "### Changed"
            echo
            printf '%s\n' "$CHANGES"
            echo
            test ! -f CHANGELOG.md || tail -n +2 CHANGELOG.md
          } > CHANGELOG.md.next
          mv CHANGELOG.md.next CHANGELOG.md

      - name: Verify candidate identity and checks
        working-directory: plugin
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          sh scripts/verify-release-version.sh "$TAG"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make check-format
          make vet
          make test
          make package-host
          make package
          PACKAGE_FILE="$(make -s package-file)"
          sh scripts/verify-package.sh "$PACKAGE_FILE" full
          sh scripts/verify-release-version.sh "$TAG" "$PACKAGE_FILE"

      - name: Report dry run
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: echo "Candidate $TAG passed checks; no commit, tag, or release was created."

      - name: Commit and tag validated release candidate
        if: ${{ !inputs.dry_run }}
        working-directory: plugin
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.yaml Makefile README.md CHANGELOG.md
          git commit -m "release: $VERSION"
          git push origin HEAD:master
          git tag -a "$TAG" -m "Release $VERSION"
          git push origin "$TAG"

  publish:
    name: Verify package and publish release
    needs: prepare
    if: >-
      ${{
        always() &&
        (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && !inputs.dry_run && needs.prepare.result == 'success'))
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release commit
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: plugin
          ref: ${{ github.event_name == 'push' && github.ref || needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Read pinned Kandev source revision
        id: sdk
        working-directory: plugin
        run: |
          set -euo pipefail
          sdk_ref="$(cat .kandev-sdk-ref)"
          [[ "$sdk_ref" =~ ^[0-9a-f]{40}$ ]]
          echo "ref=$sdk_ref" >> "$GITHUB_OUTPUT"

      - name: Check out Kandev SDK contract
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          repository: kdlbs/kandev
          path: kandev
          ref: ${{ steps.sdk.outputs.ref }}
          sparse-checkout: |
            apps/backend
            apps/packages/plugin-sdk

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Verify release identity, checks, and package
        id: verify
        working-directory: plugin
        env:
          TAG: ${{ github.event_name == 'push' && github.ref_name || needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          sh scripts/verify-release-version.sh "$TAG"
          go mod tidy
          git diff --exit-code -- go.mod go.sum
          make check-format
          make vet
          make test
          make package-host
          make package
          PACKAGE_FILE="$(make -s package-file)"
          sh scripts/verify-package.sh "$PACKAGE_FILE" full
          sh scripts/verify-release-version.sh "$TAG" "$PACKAGE_FILE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Extract checksums
        working-directory: plugin
        env:
          PACKAGE_FILE: ${{ steps.verify.outputs.package }}
        run: |
          set -euo pipefail
          tar -xOzf "$PACKAGE_FILE" checksums.txt > checksums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.verify.outputs.tag }}
          files: |
            plugin/${{ steps.verify.outputs.package }}
            plugin/checksums.txt
          generate_release_notes: true
