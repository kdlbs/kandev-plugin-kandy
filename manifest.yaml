id: "kandev-plugin-kandy"
api_version: 1
version: "0.13.1"
min_kandev_version: "0.91.1"
display_name: "Kandy"
description: "A tiny creature that grows as your agents work — it feeds on agent runs, turns, and conversation, and evolves forever in your session top bar."
author: "kandev"
repo_url: "https://github.com/kdlbs/kandev-plugin-kandy"
categories: ["tools"]

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# The kandy's lifetime XP ledger and aggregate Token Grotto live in Host state
# (scope "instance"), fed by typed event-bus signals. The XP recipe remains
# server-side only — token observations never award XP. `secrets` holds the
# HMAC integrity key in kandev's encrypted vault; each ledger uses its own
# signature domain so ledger corruption cannot counterfeit the creature. Token
# chambers are adapter/model aggregates; this event has no provider field.
capabilities:
  state: true
  secrets: true
  events:
    - "turn.completed"
    - "agent.completed"
    - "message.added"
    - "session_prompt_usage.updated.*"

actions:
  - key: "jar.connect"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "jar.disconnect"
    scope: "workspace"
    access: "admin"
    max_body_bytes: 1024
  - key: "jar.status"
    scope: "workspace"
    access: "authenticated"
    max_body_bytes: 1024

webhooks:
  - key: "kandy"
    description: "Current kandy presentation and aggregate observed-token grotto as JSON (GET; dev-only ?debug_grant=<n> when debug config is on)"
    method: "GET"
    access: "authenticated"
  - key: "pet"
    description: "Pet the kandy (POST): stamps last_petted_at, which briefly lifts the displayed mood and slowly warms its temperament. Never grants XP. Refused for 60s after a bonk."
    method: "POST"
    access: "authenticated"
  - key: "bonk"
    description: "Bonk the kandy with a bucket of cold water (POST): darkens its persistent temperament (rate-limited), drops the displayed mood for 30min and makes it refuse pets for 60s. Never touches XP."
    method: "POST"
    access: "authenticated"

config_schema:
  type: object
  additionalProperties: false
  properties:
    jar_origin:
      type: string
      title: "Kandy Jar origin"
      description: "Administrator-managed Kandy Jar server origin. HTTPS is required except for localhost development."
      default: "https://jar.kandev.ai"
    debug:
      type: boolean
      title: "Debug mode"
      description: "Enable local presentation demo controls."
      default: false

ui:
  bundle: "/ui/bundle.js"
