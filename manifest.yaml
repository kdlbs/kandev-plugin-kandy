id: "kandev-plugin-gotchi"
api_version: 1
version: "0.4.0"
display_name: "Kandev Gotchi"
description: "A tiny creature that lives in the session top bar and evolves forever as work happens in this kandev instance."
author: "kandev"
categories: ["tools"]

runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"

# The gotchi's lifetime XP ledger lives in Host state (scope "instance"),
# fed by work signals from the event bus. The XP recipe is intentionally
# server-side only — the UI never sees the factor breakdown.
capabilities:
  state: true
  events:
    - "task.state_changed"
    - "task.updated"
    - "turn.completed"
    - "agent.completed"
    - "message.added"

webhooks:
  - key: "gotchi"
    description: "Current gotchi presentation state as JSON (GET; dev-only ?debug_grant=<n> when debug config is on)"
    method: "GET"

ui:
  bundle: "/ui/bundle.js"

config_schema:
  type: object
  properties:
    debug:
      type: boolean
      title: "Debug mode"
      description: "Enables the ?debug_grant dev/demo knob on the gotchi webhook. Leave off in normal use."
      default: false
